# appId is a reverse-DNS placeholder until a real domain exists.
appId: app.rill.desktop
productName: Rill
asar: true
npmRebuild: false
electronLanguages:
  - en
  - ko
directories:
  output: release
files:
  - dist/main/**
  - dist/preload/**
  - dist/renderer/**
  - package.json
  - '!**/*.map'
  - '!node_modules/**/*'
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
extraResources:
  - from: dist/engine/rill-engine.mjs
    to: engine/rill-engine.mjs
mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  target:
    - dmg
    - zip
  identity: '-'
  hardenedRuntime: false
  gatekeeperAssess: false
